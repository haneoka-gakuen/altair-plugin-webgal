name: Bug report
description: Report a reproducible WebGAL compatibility defect
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Package and version
      placeholder: "@haneoka/altair-plugin-webgal 0.1.0"
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Minimal WebGAL source
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected conversion and round trip
    validations:
      required: true
